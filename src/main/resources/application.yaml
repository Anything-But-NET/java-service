spring:
  application:
    name: copilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:copilot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:example}
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: java-metadata-group
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual
