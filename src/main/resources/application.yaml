spring:
  web:
    locale: en_US
    locale-resolver: fixed
  application:
    name: copilot
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:copilot_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:example}
    hikari:
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    consumer:
      group-id: java-metadata-group
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  kafka:
    topics:
      ingestion: ${KAFKA_INGESTION_TOPIC:rag.documents.ingestion.v1}
  escalation:
    destination: ${ESCALATION_DESTINATION:database}
    draft-ttl: ${ESCALATION_DRAFT_TTL:15m}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
          DEGRADED: 200
          UP: 200
